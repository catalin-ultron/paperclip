name: ChronosOS CI/CD

on:
  push:
    branches: [main, master, "ultron/*"]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest with coverage
        run: |
          pip install pytest-cov
          pytest --cov=main --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload Python coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./python-service/coverage.xml
          fail_ci_if_error: false

  test-nextjs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos_secret
          POSTGRES_DB: chronos_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://chronos:chronos_secret@localhost:5432/chronos_db
        run: npx tsx src/lib/db/migrate.ts

      - name: Run Jest with coverage
        env:
          DATABASE_URL: postgresql://chronos:chronos_secret@localhost:5432/chronos_db
          REDIS_URL: redis://localhost:6379/0
        run: npm run test:ci

      - name: Upload Next.js coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./web/coverage
          fail_ci_if_error: false

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-python, test-nextjs]
    steps:
      - uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t chronos-fastapi ./python-service

      - name: Build Next.js image
        run: docker build -t chronos-web ./web

      - name: Compose up smoke test
        run: |
          docker compose up -d postgres redis
          sleep 10
          docker compose ps
          docker compose down
